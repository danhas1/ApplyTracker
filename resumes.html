<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Resumes</title>
  <style>
    body {
      width: 320px;
      background-color: #F8FAFC;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h2 { color: #005A9E; text-align: center; }
    input[type="file"] { width: 100%; margin: 10px 0; }
    ul { padding: 0; list-style: none; }
    li { background: white; border: 1px solid #ccc; border-radius: 5px; padding: 8px; margin-bottom: 8px; }
    button { background: #005A9E; color: white; border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #00457A; }
  </style>
</head>
<body>
  <h2>My Resumes</h2>
  <input type="file" id="uploadResume" accept=".pdf" />
  <ul id="resumeList"></ul>

  <button id="backBtn">⬅ Back</button>

  <script src="shared.js"></script>
  <script src="resumes.js"></script>
</body>
</html>
